name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: The committed scanner matches the source
        run: git diff --exit-code scanner/
      - name: The scanner reads the example scans
        run: |
          npx tsx -e 'import {DEMO_XML_LAST_WEEK as a, DEMO_XML_TONIGHT as b} from "./packages/core/src/demo"; import {writeFileSync} from "fs"; writeFileSync("a.xml", a); writeFileSync("b.xml", b)'
          node scanner/lamplight.cjs report b.xml
          # compare exits 1 when a new device joined, which the example has
          set +e; node scanner/lamplight.cjs compare a.xml b.xml; test $? -eq 1
      - name: End-to-end tests on the demo build
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t lamplight .
      - name: Smoke test the image
        run: docker run --rm lamplight --help
